name: Import extra motion presets

on:
  push:
    paths:
      - '.github/workflows/import-extra-patterns.yml'

permissions:
  contents: write

jobs:
  import-extra-presets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4

      - name: Checkout Autoblow Panel
        uses: actions/checkout@v4
        with:
          repository: NinjaGuyDev/autoblow-panel
          path: _sources/autoblow

      - name: Checkout Handy AI Motion
        uses: actions/checkout@v4
        with:
          repository: Fran31416/handy-ai-motion
          path: _sources/handyai

      - name: Checkout WaveDriver
        uses: actions/checkout@v4
        with:
          repository: hapticforge/wavedriver
          path: _sources/wavedriver

      - name: Export Autoblow Panel patterns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patterns/autoblow
          cp _sources/autoblow/LICENSE patterns/autoblow/LICENSE
          cat > _sources/autoblow/export-handy-presets.ts <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import { PATTERN_DEFINITIONS } from './src/lib/patternDefinitions.ts';

          const out = path.resolve(process.env.GITHUB_WORKSPACE!, 'patterns/autoblow');
          const catalog:any[] = [];
          for (const p of PATTERN_DEFINITIONS) {
            const actions = p.generator().map((a:any) => ({
              time_ms: Math.max(0, Math.round(Number(a.at) || 0)),
              position_percent: Math.max(0, Math.min(100, Math.round(Number(a.pos) || 0))),
            })).sort((a:any,b:any)=>a.time_ms-b.time_ms);
            if (actions.length < 2) continue;
            const cycle = actions[actions.length - 1].time_ms;
            const file = `ab-${p.id}.mhpattern.json`;
            const doc = {
              schema: 'handy-remote.pattern.v1',
              name: p.name,
              description: `Autoblow Panel preset · intensity: ${p.intensity} · ${p.tags.join(', ')}`,
              kind: 'routine',
              cycle_ms: cycle,
              points: actions,
              tags: ['autoblow', p.intensity, ...p.tags],
              source: 'Autoblow Panel',
              source_url: 'https://github.com/NinjaGuyDev/autoblow-panel',
              license: 'MIT'
            };
            fs.writeFileSync(path.join(out,file), JSON.stringify(doc,null,2)+'\n');
            catalog.push({
              id: `autoblow-${p.id}`,
              name: p.name,
              description: doc.description,
              category: 'autoblow',
              group: p.intensity,
              file: `patterns/autoblow/${file}`,
              cycle_ms: cycle,
              tags: doc.tags,
              source: 'Autoblow Panel',
              license: 'MIT'
            });
          }
          fs.writeFileSync(path.join(out,'_catalog.json'), JSON.stringify({source:'Autoblow Panel',count:catalog.length,patterns:catalog},null,2)+'\n');
          console.log('Autoblow patterns:', catalog.length);
          EOF
          cd _sources/autoblow
          npx -y tsx export-handy-presets.ts
          cd "$GITHUB_WORKSPACE"

      - name: Convert Handy AI Motion patterns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patterns/handy-ai
          cp _sources/handyai/LICENSE patterns/handy-ai/LICENSE
          python3 - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          src = json.loads((root/'_sources/handyai/patterns.json').read_text())
          out = root/'patterns/handy-ai'
          items = []
          for p in src.get('patterns', []):
              loop = p.get('pattern', {}).get('loop', [])
              parsed = []
              for s in loop:
                  try:
                      delay, pos = s.split(',', 1)
                      parsed.append((max(1, int(float(delay))), max(0, min(100, int(round(float(pos)))))))
                  except Exception:
                      pass
              if not parsed:
                  continue
              t = 0
              points = [{'time_ms': 0, 'position_percent': parsed[-1][1]}]
              for delay, pos in parsed:
                  t += delay
                  points.append({'time_ms': t, 'position_percent': pos})
              slug = re.sub(r'[^a-z0-9]+','-',p['name'].lower()).strip('-')
              fn = f'hai-{slug}.mhpattern.json'
              doc = {
                  'schema':'handy-remote.pattern.v1',
                  'name':p['name'].replace('_',' ').title(),
                  'description':p.get('description',''),
                  'kind':'routine','cycle_ms':t,'points':points,
                  'tags':['handy-ai','loop'],
                  'source':'Handy AI Motion',
                  'source_url':'https://github.com/Fran31416/handy-ai-motion',
                  'license':'MIT'
              }
              (out/fn).write_text(json.dumps(doc,indent=2)+'\n')
              items.append({
                  'id':f'handy-ai-{slug}','name':doc['name'],'description':doc['description'],
                  'category':'handy-ai','group':'handy-ai','file':f'patterns/handy-ai/{fn}',
                  'cycle_ms':t,'tags':doc['tags'],'source':'Handy AI Motion','license':'MIT'
              })
          (out/'_catalog.json').write_text(json.dumps({'source':'Handy AI Motion','count':len(items),'patterns':items},indent=2)+'\n')
          print('Handy AI patterns:', len(items))
          PY

      - name: Convert WaveDriver patterns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patterns/wavedriver
          cp _sources/wavedriver/LICENSE patterns/wavedriver/LICENSE
          python3 - <<'PY'
          import importlib.util, json, os, pathlib
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          modpath = root/'_sources/wavedriver/src/wavedriver/patterns.py'
          spec = importlib.util.spec_from_file_location('wdpatterns', modpath)
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          out = root/'patterns/wavedriver'
          configs = [
              ('wave','Wave',m.wave_pattern,4.0,{}),
              ('realistic','Realistic',m.realistic_pattern,4.0,{'rod_ratio':2.5}),
              ('thrust','Thrust',m.thrust_pattern,4.0,{}),
              ('escalate','Escalate',m.escalate_pattern,8.0,{'escalate_duration_s':8.0}),
          ]
          descs = {
              'Wave':'Smooth, even sinusoidal reciprocating motion.',
              'Realistic':'Asymmetric slider-crank motion with different acceleration in each direction.',
              'Thrust':'Slow retract, rapid thrust and brief hold.',
              'Escalate':'Sine movement that gradually builds its stroke depth.'
          }
          items=[]
          for slug,name,fn,duration,extra in configs:
              points=[]
              step=.05
              n=round(duration/step)
              for i in range(n+1):
                  t=i*step
                  mode,val=fn(t,0,0,110000,stroke_length_um=100000,frequency_hz=1.0,_amplitude_scale=1.0,**extra)
                  pos=(float(val)-5000.0)/100000.0*100.0
                  points.append({'time_ms':round(t*1000),'position_percent':max(0,min(100,round(pos,3)))})
              fnm=f'wd-{slug}.mhpattern.json'
              doc={'schema':'handy-remote.pattern.v1','name':name,'description':descs[name],
                   'kind':'routine','cycle_ms':round(duration*1000),'points':points,
                   'tags':['wavedriver',slug],'source':'WaveDriver',
                   'source_url':'https://github.com/hapticforge/wavedriver','license':'MIT'}
              (out/fnm).write_text(json.dumps(doc,indent=2)+'\n')
              items.append({'id':f'wavedriver-{slug}','name':name,'description':descs[name],
                            'category':'wavedriver','group':'wavedriver','file':f'patterns/wavedriver/{fnm}',
                            'cycle_ms':doc['cycle_ms'],'tags':doc['tags'],'source':'WaveDriver','license':'MIT'})
          (out/'_catalog.json').write_text(json.dumps({'source':'WaveDriver','count':len(items),'patterns':items},indent=2)+'\n')
          print('WaveDriver patterns:',len(items))
          PY

      - name: Add independently authored generator rhythms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patterns/generator
          python3 - <<'PY'
          import json, os, pathlib, random
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE']); out=root/'patterns/generator'
          def write(slug,name,desc,pts,tags):
              pts=sorted(pts,key=lambda p:p['time_ms'])
              if pts[-1]['position_percent'] != pts[0]['position_percent']:
                  pts.append({'time_ms':pts[-1]['time_ms']+250,'position_percent':pts[0]['position_percent']})
              doc={'schema':'handy-remote.pattern.v1','name':name,'description':desc,'kind':'routine',
                   'cycle_ms':pts[-1]['time_ms'],'points':pts,'tags':['generator',*tags],
                   'source':'Handy Remote Generator','license':'Original'}
              fn=f'gen-{slug}.mhpattern.json'; (out/fn).write_text(json.dumps(doc,indent=2)+'\n')
              return {'id':f'generator-{slug}','name':name,'description':desc,'category':'generator','group':'generator',
                      'file':f'patterns/generator/{fn}','cycle_ms':doc['cycle_ms'],'tags':doc['tags'],
                      'source':'Handy Remote Generator','license':'Original'}
          items=[]
          items.append(write('consistent','Consistent Rhythm','Steady full-range rhythm with even timing.',
              [{'time_ms':i*500,'position_percent':0 if i%2==0 else 100} for i in range(9)],['steady']))
          pts=[]; t=0
          for half in [900,800,700,600,500,400,320,260,220,200]:
              pts.append({'time_ms':t,'position_percent':0}); t+=half
              pts.append({'time_ms':t,'position_percent':100}); t+=half
          pts.append({'time_ms':t,'position_percent':0})
          items.append(write('build-over-time','Build Over Time','Progressively accelerates from slow strokes to fast strokes.',pts,['build','accelerating']))
          r=random.Random(2604); pts=[{'time_ms':0,'position_percent':50}]; t=0
          for _ in range(24):
              t+=r.choice([220,280,350,450,600,750])
              pts.append({'time_ms':t,'position_percent':r.choice([10,20,35,50,65,80,90])})
          items.append(write('random-phases','Random Phases','Deterministic varied phases with changing depth and timing.',pts,['random','varied']))
          def beat(slug,name,slots):
              bar=4000; pts=[{'time_ms':round(bar*idx/16),'position_percent':val} for idx,val in slots]
              return write(slug,name,f'Rhythmic pattern: {name}.',pts,['rhythm'])
          items += [
              beat('slow-quarters','Slow Quarters',[(0,0),(4,100),(8,0),(12,100),(16,0)]),
              beat('three-rest-slow','Three + Rest Slow',[(0,0),(2,100),(4,0),(6,100),(8,0),(10,100),(14,100),(16,0)]),
              beat('normal-eighths','Normal Eighths',[(0,0),(2,100),(4,0),(6,100),(8,0),(10,100),(12,0),(14,100),(16,0)]),
              beat('heartbeat','Heartbeat',[(0,0),(1,100),(2,0),(3,100),(7,100),(8,0),(9,100),(10,0),(11,100),(15,100),(16,0)]),
              beat('seven-beat','Seven Beat',[(0,0),(1,100),(2,0),(3,100),(4,0),(5,100),(6,0),(7,100),(8,0),(9,100),(10,0),(11,100),(12,0),(13,100),(15,100),(16,0)]),
              beat('double-time','Double Time',[(i,0 if i%2==0 else 100) for i in range(17)]),
          ]
          (out/'_catalog.json').write_text(json.dumps({'source':'Handy Remote Generator','count':len(items),'patterns':items},indent=2)+'\n')
          print('Generator patterns:',len(items))
          PY

      - name: Build combined catalog and update UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          base=json.loads((root/'patterns/magichandy/catalog.json').read_text())
          patterns=[]
          for x in base.get('patterns',[]):
              y=dict(x); y.setdefault('source','MagicHandy'); y.setdefault('license','GPL-3.0'); patterns.append(y)
          for path in [root/'patterns/autoblow/_catalog.json',root/'patterns/handy-ai/_catalog.json',root/'patterns/wavedriver/_catalog.json',root/'patterns/generator/_catalog.json']:
              patterns.extend(json.loads(path.read_text()).get('patterns',[]))
          combined={
              'schema':'handy-remote.motion-catalog.v2','count':len(patterns),
              'sources':[
                  {'name':'MagicHandy','license':'GPL-3.0','url':'https://github.com/mapledaemon/MagicHandy'},
                  {'name':'Autoblow Panel','license':'MIT','url':'https://github.com/NinjaGuyDev/autoblow-panel'},
                  {'name':'Handy AI Motion','license':'MIT','url':'https://github.com/Fran31416/handy-ai-motion'},
                  {'name':'WaveDriver','license':'MIT','url':'https://github.com/hapticforge/wavedriver'},
                  {'name':'Handy Remote Generator','license':'Original'}],
              'patterns':patterns}
          (root/'patterns/catalog.json').write_text(json.dumps(combined,indent=2)+'\n')

          app=root/'app-v4.html'; s=app.read_text()
          s=s.replace('MagicHandy Library · Smooth HSP','Multi-Source Library · Smooth HSP')
          s=s.replace("./patterns/magichandy/catalog.json?v=1","./patterns/catalog.json?v=2")
          s=s.replace("`${d.count||0} MagicHandy-Presets geladen`","`${d.count||0} externe Presets geladen`")
          s=s.replace("file:'./'+x.file,cycle:x.cycle_ms,tags:x.tags||[]})","file:'./'+x.file,cycle:x.cycle_ms,tags:x.tags||[],source:x.source||'Preset'})")
          s=s.replace("${p.file?'<div class=\\\"sourceTag\\\">MagicHandy</div>':''}","${p.file?'<div class=\\\"sourceTag\\\">'+(p.source||'Preset')+'</div>':''}")
          s=s.replace("${p.file?'MagicHandy':'Smooth HSP'} · ${pts.length} Punkte","${p.file?(p.source||'Preset'):'Smooth HSP'} · ${pts.length} Punkte")
          s=s.replace("continuous:'Continuous',easy:'Easy',gentle:'Gentle',steady:'Steady',fast:'Fast',intense:'Intense',own:'Eigene'","continuous:'Continuous',easy:'Easy',gentle:'Gentle',steady:'Steady',fast:'Fast',intense:'Intense',autoblow:'Autoblow','handy-ai':'Handy AI',wavedriver:'WaveDriver',generator:'Generator',own:'Eigene'")
          s=s.replace("cat==='intense'?'◆':'◇'","cat==='intense'?'◆':cat==='autoblow'?'◈':cat==='handy-ai'?'AI':cat==='wavedriver'?'∿':cat==='generator'?'♬':'◇'")
          s=s.replace('<option value="intense">Intense</option><option value="own">Eigene</option>','<option value="intense">Intense</option><option value="autoblow">Autoblow</option><option value="handy-ai">Handy AI</option><option value="wavedriver">WaveDriver</option><option value="generator">Generator</option><option value="own">Eigene</option>')
          s=s.replace('Handy Remote 4.0 · HSP/Funscript motion engine','Handy Remote 8.0 · Multi-Source HSP Library')
          s=s.replace('./sw.js?v=4','./sw.js?v=8')
          app.write_text(s)

          sw=root/'sw.js'; w=sw.read_text().replace("handy-remote-pro-v7","handy-remote-pro-v8")
          w=w.replace("'./patterns/magichandy/catalog.json'","'./patterns/catalog.json'")
          sw.write_text(w)

          notices=root/'THIRD_PARTY_NOTICES.md'
          text=notices.read_text() if notices.exists() else '# Third-party notices\n'
          additions = "\\n\\n## Autoblow Panel\\nSource: https://github.com/NinjaGuyDev/autoblow-panel\\nLicense: MIT. Motion preset definitions are converted to the local pattern format.\\n\\n## Handy AI Motion\\nSource: https://github.com/Fran31416/handy-ai-motion\\nLicense: MIT. The predefined loop patterns are converted to the local pattern format.\\n\\n## WaveDriver\\nSource: https://github.com/hapticforge/wavedriver\\nLicense: MIT. The four position motion functions are sampled into local loop patterns.\\n\\n## Generator patterns\\nAdditional rhythm/generator presets in patterns/generator are independently authored for this project. Public descriptions of common consistent/build/random-phase and beat-based motion were used as general inspiration; no proprietary source code is copied.\\n"

          if '## Autoblow Panel' not in text: text += additions
          notices.write_text(text)
          print('Combined external patterns:',len(patterns))
          PY

      - name: Commit imported presets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _sources
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patterns app-v4.html sw.js THIRD_PARTY_NOTICES.md
          if git diff --cached --quiet; then echo 'No changes.'; exit 0; fi
          git commit -m 'Import additional motion preset libraries'
          git push
