name: Apply MagicHandy library to app

on:
  push:
    paths:
      - '.github/workflows/apply-magichandy-library.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch app UI and loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app-v4.html')
          s = p.read_text(encoding='utf-8')

          if 'presetSearch' not in s:
              css = '.libraryTools{display:grid;gap:10px}.libraryFilters{display:grid;grid-template-columns:1fr 145px;gap:8px}.libraryFilters input,.libraryFilters select{width:100%;min-height:46px;border:1px solid var(--line);background:#0b0c10;color:#fff;border-radius:14px;padding:10px 12px;font-size:14px;outline:none}.libraryFilters input:focus,.libraryFilters select:focus{border-color:var(--blue)}.libraryCount{font-size:12px;color:var(--muted);font-weight:700}.sourceTag{font-size:10px;color:#8e8e93;margin-top:8px}'
              s = s.replace('.wavePreview{width:100%;height:34px;margin-top:10px;display:block}.version', '.wavePreview{width:100%;height:34px;margin-top:10px;display:block}'+css+'.version')
              s = s.replace('Smooth HSP · Funscript-Style', 'MagicHandy Library · Smooth HSP')

              preset_block = '<div><div class="row" style="margin:2px 4px 9px"><div><div class="kicker">Presets</div><div style="font-size:20px;font-weight:850">Smooth Motion</div></div><span class="badge">HSP buffered</span></div><div id="presetGrid" class="presetGrid"></div></div>'
              library_block = '<div class="card libraryTools"><div class="row"><div><div class="kicker">Preset-Bibliothek</div><div style="font-size:19px;font-weight:850">Alle Bewegungsmuster</div></div><div id="presetCount" class="libraryCount">lädt …</div></div><div class="libraryFilters"><input id="presetSearch" type="search" placeholder="Preset suchen…" autocomplete="off"><select id="presetCategory"><option value="all">Alle Kategorien</option><option value="continuous">Continuous</option><option value="easy">Easy</option><option value="gentle">Gentle</option><option value="steady">Steady</option><option value="fast">Fast</option><option value="intense">Intense</option><option value="own">Eigene</option></select></div><div class="hint">MagicHandy-Presets werden als relative 0–100-Bewegung geladen. Deine globale Min-/Max-Grenze bleibt die harte physische Grenze.</div></div>\n    '+preset_block
              s = s.replace(preset_block, library_block)

              s = s.replace("padPos:$('padPos')};", "padPos:$('padPos'),search:$('presetSearch'),category:$('presetCategory'),count:$('presetCount')};")
              s = s.replace("serverOffset=0,serverOffsetAt=0;", "serverOffset=0,serverOffsetAt=0,libraryLoaded=false;")

              for pid in ('classic','slow','deep','shallow','pulse','wave','grind','random','build'):
                  s = s.replace("{id:'"+pid+"',", "{category:'own',id:'"+pid+"',")

              render = '''function renderPresets(){const q=(E.search?.value||'').trim().toLowerCase(),cat=E.category?.value||'all';E.grid.innerHTML='';let shown=0;for(const p of PRESETS){if(cat!=='all'&&p.category!==cat)continue;if(q&&!`${p.name} ${p.desc||''} ${p.tag||''}`.toLowerCase().includes(q))continue;const b=document.createElement('button');b.className='preset';b.dataset.id=p.id;b.innerHTML=`<span class="presetTag">${p.tag||'Preset'}</span><div class="presetIcon">${p.icon||'◆'}</div><div class="presetName">${p.name}</div><div class="presetDesc">${p.desc||''}</div>${p.file?'<div class="sourceTag">MagicHandy</div>':''}`;b.onclick=()=>startPreset(p.id);E.grid.appendChild(b);shown++}if(E.count)E.count.textContent=`${shown} / ${PRESETS.length}`}
          function categoryIcon(cat){return cat==='continuous'?'∞':cat==='easy'?'○':cat==='gentle'?'◌':cat==='steady'?'↕':cat==='fast'?'⚡':cat==='intense'?'◆':'◇'}
          function categoryLabel(cat){return ({continuous:'Continuous',easy:'Easy',gentle:'Gentle',steady:'Steady',fast:'Fast',intense:'Intense',own:'Eigene'})[cat]||'Preset'}
          async function loadPatternLibrary(){if(libraryLoaded)return;try{const r=await fetch('./patterns/magichandy/catalog.json?v=1',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();for(const x of d.patterns||[]){if(PRESETS.some(p=>p.id===x.id))continue;PRESETS.push({id:x.id,name:x.name,desc:x.description||'',tag:categoryLabel(x.category),category:x.category,icon:categoryIcon(x.category),file:'./'+x.file,cycle:x.cycle_ms,tags:x.tags||[]})}libraryLoaded=true;renderPresets();log('Preset-Bibliothek',`${d.count||0} MagicHandy-Presets geladen`)}catch(e){if(E.count)E.count.textContent='Bibliothek-Fehler';log('Preset-Bibliothek',e.message)}}'''
              s = re.sub(r'function renderPresets\(\)\{.*?\}\nfunction markPreset', render+'\nfunction markPreset', s, count=1, flags=re.S)

              needle = "function toHspPoints(actions){const raw=actions.map(a=>({t:Math.max(0,Math.round(a.at)),x:Math.round(clamp(a.pos,0,100))}));const out=[];for(let i=0;i<raw.length;i++){const p=raw[i],prev=raw[i-1],next=raw[i+1];if(i>0&&i<raw.length-1&&prev.x===p.x&&next.x===p.x)continue;out.push(p)}return out.slice(0,100)}"
              extra = needle + "\nfunction fitTimeline(actions,maxPoints=96){if(actions.length<=maxPoints)return actions;const src=[...actions].sort((a,b)=>a.at-b.at),start=src[0].at,end=src[src.length-1].at,out=[];let j=0;for(let i=0;i<maxPoints;i++){const at=start+(end-start)*i/(maxPoints-1);while(j<src.length-2&&src[j+1].at<at)j++;const a=src[j],b=src[j+1],u=b.at===a.at?0:(at-a.at)/(b.at-a.at);out.push({at:Math.round(at),pos:a.pos+(b.pos-a.pos)*clamp(u,0,1)})}out[0]={...src[0]};out[out.length-1]={...src[src.length-1]};return out}\nasync function loadFileActions(p){const r=await fetch(p.file,{cache:'no-store'});if(!r.ok)throw Error(`Preset-Datei HTTP ${r.status}`);const d=await r.json();if(!Array.isArray(d.points)||d.points.length<2)throw Error('Preset enthält keine gültige Punktfolge.');const actions=d.points.map(x=>({at:Number(x.time_ms),pos:Number(x.position_percent)})).filter(x=>Number.isFinite(x.at)&&Number.isFinite(x.pos));if(actions.length<2)throw Error('Preset enthält zu wenige gültige Punkte.');return fitTimeline(actions,96)}"
              s = s.replace(needle, extra)

              start = '''async function startPreset(id){const p=PRESETS.find(x=>x.id===id);if(!p)return;const token=++runToken;hamp=false;activePresetId=id;markPreset(id);E.activeName.textContent=p.name;E.activeDetail.textContent=p.file?'Preset-Datei wird geladen …':'HSP wird gepuffert …';setStatus('Lädt');try{await stopMotionQuiet();if(token!==runToken)return;const actions=p.file?await loadFileActions(p):p.actions();const pts=toHspPoints(actions);if(pts.length<2||pts.length>100)throw Error(`Ungültige Punktzahl: ${pts.length}`);streamId=(streamId%4294967294)+1;await setMode(4);await applySliderBounds();await api('hsp/setup',{method:'PUT',body:{stream_id:streamId},quiet:true});await api('hsp/add',{method:'PUT',body:{points:pts,flush:true,tail_point_stream_index:pts.length,tail_point_threshold:Math.max(1,pts.length-2)},quiet:true,timeout:10000});const st=await syncServerTime();if(token!==runToken)return;const rate=+(0.35+2.65*(clamp(+E.tempo.value,10,100)/100)).toFixed(2);await api('hsp/play',{method:'PUT',body:{start_time:0,server_time:Math.round(st),playback_rate:rate,pause_on_starving:false,loop:true},quiet:true});E.activeDetail.textContent=`${p.file?'MagicHandy':'Smooth HSP'} · ${pts.length} Punkte · Hub ${bounds().min}–${bounds().max}% · ${E.tempo.value}%`;setStatus('Verbunden','ok')}catch(e){if(token===runToken){activePresetId='';markPreset('');E.activeName.textContent='Fehler';E.activeDetail.textContent=e.message;setStatus('HSP-Fehler','bad');log('HSP',e.message)}}}'''
              s = re.sub(r'async function startPreset\(id\)\{.*?\}\nasync function emergencyStop', start+'\nasync function emergencyStop', s, count=1, flags=re.S)

              bind = "$('check').onclick=check;$('stop').onclick=emergencyStop;$('hampStart').onclick=hampStart;$('hampStop').onclick=emergencyStop;$('save').onclick=saveCreds;$('clear').onclick=clearCreds;document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));"
              s = s.replace(bind, bind+"if(E.search)E.search.oninput=renderPresets;if(E.category)E.category.onchange=renderPresets;")
              s = s.replace('renderBounds();renderPresets();poll();', 'renderBounds();renderPresets();loadPatternLibrary();poll();')

          s = re.sub(r'Handy Remote 4\.\d+ · [^<]+', 'Handy Remote 7.0 · 76 MagicHandy Presets + eigene', s)
          s = re.sub(r"sw\.js\?v=\d+", 'sw.js?v=7', s)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install v7 service worker
        shell: bash
        run: |
          cat > sw.js <<'EOF'
          const CACHE='handy-remote-pro-v7';
          const ASSETS=['./','./index.html','./app-v4.html','./manifest.webmanifest','./patterns/magichandy/catalog.json'];
          const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

          function pchipSlopes(t,x){
            const n=t.length,m=new Array(n).fill(0),h=[],d=[];
            for(let i=0;i<n-1;i++){h[i]=t[i+1]-t[i];d[i]=(x[i+1]-x[i])/h[i]}
            if(n===2){m[0]=m[1]=d[0];return m}
            const endpoint=(h0,h1,d0,d1)=>{let v=((2*h0+h1)*d0-h0*d1)/(h0+h1);if(Math.sign(v)!==Math.sign(d0))v=0;else if(Math.sign(d0)!==Math.sign(d1)&&Math.abs(v)>Math.abs(3*d0))v=3*d0;return v};
            m[0]=endpoint(h[0],h[1],d[0],d[1]);m[n-1]=endpoint(h[n-2],h[n-3],d[n-2],d[n-3]);
            for(let i=1;i<n-1;i++){if(d[i-1]===0||d[i]===0||d[i-1]*d[i]<=0){m[i]=0;continue}const w1=2*h[i]+h[i-1],w2=h[i]+2*h[i-1];m[i]=(w1+w2)/(w1/d[i-1]+w2/d[i])}
            return m;
          }
          function pchipEval(q,t,x,m){let i=0;while(i<t.length-2&&q>t[i+1])i++;const h=t[i+1]-t[i],s=clamp((q-t[i])/h,0,1),s2=s*s,s3=s2*s;return(2*s3-3*s2+1)*x[i]+(s3-2*s2+s)*h*m[i]+(-2*s3+3*s2)*x[i+1]+(s3-s2)*h*m[i+1]}
          function smoothHspPoints(points){let src=(Array.isArray(points)?points:[]).map(p=>({t:Math.max(0,Math.round(Number(p.t)||0)),x:clamp(Number(p.x)||0,0,100)})).sort((a,b)=>a.t-b.t);src=src.filter((p,i)=>i===0||p.t>src[i-1].t);if(src.length<2)return src.map(p=>({t:p.t,x:Math.round(p.x)}));src[src.length-1].x=src[0].x;const t=src.map(p=>p.t),x=src.map(p=>p.x),duration=t[t.length-1]-t[0];if(duration<=0)return src.map(p=>({t:p.t,x:Math.round(p.x)}));const m=pchipSlopes(t,x),step=Math.max(25,Math.ceil((duration/99)/5)*5),raw=[];for(let q=t[0];q<t[t.length-1];q+=step)raw.push({t:Math.round(q),x:Math.round(clamp(pchipEval(q,t,x,m),0,100))});raw.push({t:t[t.length-1],x:Math.round(src[0].x)});const out=[];for(let i=0;i<raw.length;i++){const p=raw[i],prev=raw[i-1],next=raw[i+1];if(i>0&&i<raw.length-1&&prev.x===p.x&&next.x===p.x)continue;out.push(p)}return out.slice(0,100)}

          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{
            const u=new URL(e.request.url);
            if(e.request.method==='PUT'&&u.pathname.endsWith('/hsp/add')){
              e.respondWith((async()=>{try{const body=await e.request.clone().json();if(Array.isArray(body?.points)){body.points=smoothHspPoints(body.points);body.tail_point_stream_index=body.points.length;body.tail_point_threshold=Math.max(1,body.points.length-2)}return fetch(new Request(e.request,{body:JSON.stringify(body)}))}catch{return fetch(e.request)}})());return;
            }
            if(e.request.method!=='GET')return;
            e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open(CACHE).then(x=>x.put(e.request,c));return r}).catch(()=>caches.match(e.request)));
          });
          EOF

      - name: Remove temporary duplicate imports
        shell: bash
        run: |
          rm -f patterns/magichandy/easy-drive-1.mhpattern.json patterns/magichandy/easy-drive-2.mhpattern.json

      - name: Validate app JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess, tempfile
          s=pathlib.Path('app-v4.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m: raise SystemExit('script block missing')
          pathlib.Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Commit app integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v4.html sw.js patterns/magichandy
          git commit -m 'Enable full MagicHandy preset library in controller'
          git push
