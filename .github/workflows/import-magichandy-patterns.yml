name: Import MagicHandy patterns

on:
  push:
    paths:
      - '.github/workflows/import-magichandy-patterns.yml'

permissions:
  contents: write

jobs:
  import-patterns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout MagicHandy source
        uses: actions/checkout@v4
        with:
          repository: mapledaemon/MagicHandy
          path: _magichandy

      - name: Copy curated pattern library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patterns/magichandy/curated patterns/magichandy/continuous
          cp _magichandy/internal/motion/builtinpatterns/curated/*.json patterns/magichandy/curated/
          cp _magichandy/LICENSE patterns/magichandy/LICENSE

      - name: Export all continuous patterns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _magichandy/cmd/exportpatterns
          cat > _magichandy/cmd/exportpatterns/main.go <<'EOF'
          package main

          import (
            "encoding/json"
            "fmt"
            "os"
            "path/filepath"

            "github.com/mapledaemon/MagicHandy/internal/motion"
          )

          type patternFile struct {
            Schema      string              `json:"schema"`
            Name        string              `json:"name"`
            Description string              `json:"description,omitempty"`
            Kind        string              `json:"kind"`
            CycleMS     int64               `json:"cycle_ms"`
            Points      []motion.CurvePoint `json:"points"`
            Tags        []string            `json:"tags,omitempty"`
          }

          func main() {
            out := os.Getenv("OUTPUT_DIR")
            if out == "" { panic("OUTPUT_DIR missing") }
            if err := os.MkdirAll(out, 0755); err != nil { panic(err) }
            recipes := motion.ContinuousRecipes(25)
            for _, recipe := range recipes {
              pts, dur, ok := motion.ContinuousPatternPreview(recipe.ID)
              if !ok { panic(fmt.Sprintf("preview unavailable: %s", recipe.ID)) }
              doc := patternFile{
                Schema: "magichandy.pattern.v1",
                Name: recipe.Name,
                Description: recipe.Description,
                Kind: "routine",
                CycleMS: dur,
                Points: pts,
                Tags: []string{"continuous", "smooth"},
              }
              b, err := json.MarshalIndent(doc, "", "  ")
              if err != nil { panic(err) }
              name := filepath.Join(out, string(recipe.ID)+".mhpattern.json")
              if err := os.WriteFile(name, append(b, '\n'), 0644); err != nil { panic(err) }
            }
            fmt.Printf("exported %d continuous patterns\n", len(recipes))
          }
          EOF
          cd _magichandy
          OUTPUT_DIR="$GITHUB_WORKSPACE/patterns/magichandy/continuous" go run ./cmd/exportpatterns
          cd "$GITHUB_WORKSPACE"
          rm -rf _magichandy

      - name: Build combined browser catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('patterns/magichandy')
          items = []
          for group in ('continuous', 'curated'):
              for path in sorted((root / group).glob('*.mhpattern.json')):
                  doc = json.loads(path.read_text(encoding='utf-8'))
                  stem = path.name[:-len('.mhpattern.json')]
                  if group == 'continuous':
                      category = 'continuous'
                  elif stem.startswith('easy-'):
                      category = 'easy'
                  elif stem.startswith('gentle-'):
                      category = 'gentle'
                  elif stem.startswith('steady-'):
                      category = 'steady'
                  elif stem.startswith('fast-'):
                      category = 'fast'
                  elif stem.startswith('intense-'):
                      category = 'intense'
                  else:
                      category = 'curated'
                  items.append({
                      'id': f'mh-{group}-{stem}',
                      'name': doc.get('name', stem),
                      'description': doc.get('description', ''),
                      'category': category,
                      'group': group,
                      'file': f'patterns/magichandy/{group}/{path.name}',
                      'cycle_ms': doc.get('cycle_ms'),
                      'tags': doc.get('tags', []),
                  })
          payload = {
              'schema': 'handy-remote.magichandy-catalog.v1',
              'source': 'https://github.com/mapledaemon/MagicHandy',
              'license': 'GPL-3.0',
              'count': len(items),
              'patterns': items,
          }
          (root / 'catalog.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f"catalog contains {len(items)} patterns")
          PY

      - name: Commit imported patterns
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patterns/magichandy
          if git diff --cached --quiet; then
            echo 'No pattern changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh complete MagicHandy preset catalog'
          git push
