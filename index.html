<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090b0f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Handy Remote"><link rel="manifest" href="manifest.webmanifest"><title>Handy Remote Pro</title><style>:root{color-scheme:dark;--bg:#090b0f;--card:#141922;--line:#29313d;--text:#f4f7fb;--muted:#8d99a8;--cyan:#5bd6ff;--green:#4bd79b;--red:#ff5364;--violet:#a78bfa}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:max(18px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom));min-height:100dvh}.app{max-width:680px;margin:auto}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.top{margin-bottom:14px}h1{font-size:24px;margin:0}.muted{color:var(--muted);font-size:12px}.grid{display:grid;gap:12px}.card{background:linear-gradient(180deg,#171d25,var(--card));border:1px solid var(--line);border-radius:20px;padding:16px}.status{padding:8px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7c8796;margin-right:6px}.ok{background:var(--green)}.bad{background:var(--red)}button,input{font:inherit}.stop{width:100%;min-height:84px;border:0;border-radius:20px;background:linear-gradient(#ff6878,#d92f42);color:white;font-size:26px;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn,.preset,.pattern{border:1px solid var(--line);background:#1b222c;color:var(--text);border-radius:13px;padding:12px;font-weight:750}.btn.primary{background:var(--cyan);color:#031015;border:0}.btn.green{background:var(--green);color:#04120d;border:0}.btn.violet{background:var(--violet);color:#0b0616;border:0}input[type=range]{width:100%;accent-color:var(--cyan);height:34px}.value{font-size:28px;font-weight:900}.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.patterns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.pattern.active{border-color:var(--violet);color:#c6b7ff}.field{margin-top:10px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.field input{width:100%;background:#0b0f14;border:1px solid var(--line);border-radius:12px;padding:12px;color:white}.rangeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.joy{height:240px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(90deg,transparent 49.5%,#ffffff10 50%,transparent 50.5%),linear-gradient(0deg,transparent 49.5%,#ffffff10 50%,transparent 50.5%),#0b0f14;position:relative;touch-action:none;overflow:hidden}.knob{position:absolute;width:54px;height:54px;border-radius:50%;background:var(--cyan);left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 8px #5bd6ff18}.log{white-space:pre-wrap;word-break:break-word;background:#080b0f;border:1px solid var(--line);border-radius:12px;padding:10px;max-height:150px;overflow:auto;font:10px/1.4 ui-monospace,monospace}.pill{font-size:11px;color:var(--muted)}details summary{cursor:pointer;font-weight:800}@media(min-width:580px){.patterns{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="app"><div class="top"><div><h1>Handy Remote Pro</h1><div class="muted">REST API v3</div></div><div class="status"><span id="dot" class="dot"></span><span id="status">Nicht geprüft</span></div></div><div class="grid"><button id="stop" class="stop">■ STOP</button><div class="card"><div class="row"><div><b>Gerät</b><div id="motion" class="muted">Gestoppt</div></div><div><span id="pos" class="value">--</span><span class="muted"> %</span></div></div><div class="actions" style="margin-top:12px"><button id="start" class="btn green">▶ Start</button><button id="check" class="btn">Verbindung</button></div></div><div class="card"><div class="row"><div><b>Geschwindigkeit</b><div class="muted">HAMP</div></div><div><span id="speedVal" class="value">30</span><span class="muted">%</span></div></div><input id="speed" type="range" min="0" max="100" value="30"><div class="presets"><button class="preset" data-s="20">Langsam</button><button class="preset" data-s="40">Mittel</button><button class="preset" data-s="65">Schnell</button><button class="preset" data-s="85">Turbo</button></div></div><div class="card"><b>Hubbereich</b><div id="rangeText" class="muted">10–90%</div><div class="rangeGrid"><div><span class="pill">Minimum</span><input id="rmin" type="range" min="0" max="95" value="10"></div><div><span class="pill">Maximum</span><input id="rmax" type="range" min="5" max="100" value="90"></div></div><button id="applyRange" class="btn primary" style="width:100%">Hub anwenden</button></div><div class="card"><div class="row"><div><b>Bewegungsmuster</b><div class="muted">HDSP</div></div><button id="patternStop" class="btn">Stop</button></div><div class="patterns"><button class="pattern" data-p="smooth">Smooth</button><button class="pattern" data-p="pulse">Pulse</button><button class="pattern" data-p="wave">Wave</button><button class="pattern" data-p="random">Random</button></div></div><div class="card"><div class="row"><div><b>Auto-Modus</b><div id="autoInfo" class="muted">Musterwechsel automatisch</div></div><span id="autoState" class="pill">AUS</span></div><div class="actions" style="margin-top:10px"><button id="autoStart" class="btn violet">Auto starten</button><button id="autoStop" class="btn">Auto stoppen</button></div></div><div class="card"><div class="row"><div><b>Manuelle Position</b><div class="muted">Y = Position · X = Tempo</div></div><button id="center" class="btn">50%</button></div><div id="joy" class="joy"><div id="knob" class="knob"></div></div><div class="row" style="margin-top:8px"><span class="pill">Ziel <b id="joyPos">50%</b></span><span class="pill">Fahrzeit <b id="joyTime">900 ms</b></span></div></div><details class="card" open><summary>Verbindung & Einstellungen</summary><div class="field"><label>Application ID (X-Api-Key)</label><input id="appId" type="password" autocomplete="off"></div><div class="field"><label>Connection Key (X-Connection-Key)</label><input id="ck" type="password" autocomplete="off"></div><label class="pill" style="display:block;margin:10px 0"><input id="remember" type="checkbox" checked> lokal im Browser speichern</label><div class="actions"><button id="save" class="btn primary">Speichern</button><button id="clear" class="btn">Löschen</button></div></details><details class="card"><summary>Diagnose</summary><div id="log" class="log">Bereit.</div></details></div></div><script>(()=>{'use strict';const API='https://www.handyfeeling.com/api/handy-rest/v3/',$=id=>document.getElementById(id),E={dot:$('dot'),status:$('status'),motion:$('motion'),pos:$('pos'),speed:$('speed'),speedVal:$('speedVal'),rmin:$('rmin'),rmax:$('rmax'),rangeText:$('rangeText'),appId:$('appId'),ck:$('ck'),remember:$('remember'),log:$('log'),joy:$('joy'),knob:$('knob'),joyPos:$('joyPos'),joyTime:$('joyTime'),autoState:$('autoState'),autoInfo:$('autoInfo')};let hamp=false,patternToken=0,autoToken=0,pollTimer,joyLast=0,speedTimer;const K={a:'hr.a',c:'hr.c',s:'hr.s',mi:'hr.mi',ma:'hr.ma'};function lg(s,o){const line=`[${new Date().toLocaleTimeString()}] ${s}${o!==undefined?' '+JSON.stringify(o):''}`;E.log.textContent=(E.log.textContent==='Bereit.'?'':E.log.textContent+'\n')+line;E.log.scrollTop=99999}function stat(t,k=''){E.status.textContent=t;E.dot.className='dot '+k}function creds(){const a=E.appId.value.trim(),c=E.ck.value.trim();if(!a||!c)throw Error('Application ID und Connection Key fehlen.');return{a,c}}async function api(path,{method='GET',body,timeout=9000,quiet=false}={}){const{a,c}=creds(),ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);try{if(!quiet)lg(method+' /'+path,body);const r=await fetch(API+path,{method,headers:{Accept:'application/json','X-Api-Key':a,'X-Connection-Key':c,...(body!==undefined?{'Content-Type':'application/json'}:{})},body:body!==undefined?JSON.stringify(body):undefined,signal:ctl.signal});const txt=await r.text();let d=txt;try{d=txt?JSON.parse(txt):{}}catch{}if(!r.ok)throw Error('HTTP '+r.status+' '+(typeof d==='string'?d:JSON.stringify(d)));if(!quiet)lg('OK '+r.status,d);return d}catch(e){if(!quiet)lg('FEHLER',e.message);throw e}finally{clearTimeout(timer)}}function save(){localStorage.setItem(K.s,E.speed.value);localStorage.setItem(K.mi,E.rmin.value);localStorage.setItem(K.ma,E.rmax.value);if(E.remember.checked){localStorage.setItem(K.a,E.appId.value);localStorage.setItem(K.c,E.ck.value)}else{localStorage.removeItem(K.a);localStorage.removeItem(K.c)}}function load(){E.appId.value=localStorage.getItem(K.a)||'';E.ck.value=localStorage.getItem(K.c)||'';E.speed.value=localStorage.getItem(K.s)||30;E.rmin.value=localStorage.getItem(K.mi)||10;E.rmax.value=localStorage.getItem(K.ma)||90;uiSpeed();uiRange();startPoll()}function uiSpeed(){E.speedVal.textContent=E.speed.value}function uiRange(ch=''){let a=+E.rmin.value,b=+E.rmax.value;if(b-a<5){if(ch==='min')a=Math.max(0,b-5);else b=Math.min(100,a+5)}E.rmin.value=a;E.rmax.value=b;E.rangeText.textContent=a+'–'+b+'%'}async function setMode(mode){return api('mode2',{method:'PUT',body:{mode},quiet:true})}async function setSpeed(){return api('hamp/velocity',{method:'PUT',body:{velocity:+(+E.speed.value/100).toFixed(4)},quiet:true})}async function setRange(){uiRange();return api('hamp/stroke',{method:'PUT',body:{min:+(+E.rmin.value/100).toFixed(4),max:+(+E.rmax.value/100).toFixed(4)}})}async function check(){try{const d=await api('connected');const x=d?.result??d;const ok=x===true||x?.connected===true||d?.connected===true;stat(ok?'Verbunden':'Offline',ok?'ok':'bad')}catch(e){stat('Fehler','bad')}}async function start(){patternToken++;autoToken++;try{await setMode(0);await setRange();await setSpeed();await api('hamp/start',{method:'PUT'});hamp=true;E.motion.textContent='HAMP läuft';stat('Verbunden','ok')}catch(e){stat('Fehler','bad')}}async function stop(){patternToken++;autoToken++;hamp=false;E.autoState.textContent='AUS';try{await setMode(0);await api('hamp/stop',{method:'PUT',quiet:true});E.motion.textContent='Gestoppt';stat('Verbunden','ok')}catch(e){E.motion.textContent='Stop-Fehler';stat('Fehler','bad')}}const sleep=ms=>new Promise(r=>setTimeout(r,ms));function step(name,i){const mi=+E.rmin.value,ma=+E.rmax.value,span=ma-mi,s=+E.speed.value;if(name==='smooth')return{p:i%2?mi:ma,t:Math.max(250,1200-s*7)};if(name==='pulse')return{p:mi+span*(i%2?.35:.9),t:Math.max(150,650-s*4)};if(name==='wave'){const q=[.05,.95,.2,.8,.35,.65];return{p:mi+span*q[i%q.length],t:Math.max(180,850-s*3)}}return{p:mi+Math.random()*span,t:Math.max(180,1000-Math.random()*600-s*2)}}async function move(p,t){await setMode(2);return api('hdsp/xpt',{method:'PUT',body:{xp:+(Math.max(0,Math.min(100,p))/100).toFixed(4),t:Math.max(80,Math.round(t)),stop_on_target:true,immediate_rsp:false},quiet:true})}function clearPat(){document.querySelectorAll('.pattern').forEach(b=>b.classList.remove('active'))}async function runPattern(name){autoToken++;const token=++patternToken;hamp=false;clearPat();document.querySelector(`[data-p="${name}"]`)?.classList.add('active');E.motion.textContent='Muster: '+name;try{let i=0;while(token===patternToken){const q=step(name,i++);await move(q.p,q.t);await sleep(q.t+40)}}catch(e){if(token===patternToken)stat('Muster-Fehler','bad')}finally{if(token===patternToken)clearPat()}}async function auto(){const token=++autoToken;patternToken++;E.autoState.textContent='AN';const names=['smooth','pulse','wave','random'];while(token===autoToken){const n=names[Math.floor(Math.random()*names.length)];E.speed.value=25+Math.floor(Math.random()*61);uiSpeed();E.autoInfo.textContent=n+' · '+E.speed.value+'%';const pt=++patternToken;clearPat();document.querySelector(`[data-p="${n}"]`)?.classList.add('active');const until=Date.now()+12000+Math.random()*13000;let i=0;try{while(token===autoToken&&pt===patternToken&&Date.now()<until){const q=step(n,i++);await move(q.p,q.t);await sleep(q.t+40)}}catch{break}}if(token===autoToken){E.autoState.textContent='AUS';clearPat()}}async function poll(){try{const d=await api('slider/state',{quiet:true,timeout:5000}),x=d?.result??d;let p=x?.position;if(typeof p==='number'){if(p<=1.01)p*=100;E.pos.textContent=Math.round(p)}}catch{}}function startPoll(){clearInterval(pollTimer);poll();pollTimer=setInterval(poll,2500)}function joyVal(e){const r=E.joy.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left)),y=Math.max(0,Math.min(r.height,e.clientY-r.top)),p=Math.round((1-y/r.height)*100),t=Math.round(1800-(x/r.width)*1650);return{x,y,p,t}}function joyDraw(v){E.knob.style.left=v.x+'px';E.knob.style.top=v.y+'px';E.joyPos.textContent=v.p+'%';E.joyTime.textContent=v.t+' ms'}async function joySend(v){joyLast=Date.now();patternToken++;autoToken++;clearPat();try{await move(v.p,v.t);E.motion.textContent='Manuell · '+v.p+'%'}catch(e){stat('Fehler','bad')}}function joyMove(e){e.preventDefault();const v=joyVal(e);joyDraw(v);if(Date.now()-joyLast>180)joySend(v)}E.joy.onpointerdown=e=>{E.joy.setPointerCapture(e.pointerId);joyMove(e)};E.joy.onpointermove=e=>{if(E.joy.hasPointerCapture(e.pointerId))joyMove(e)};$('center').onclick=()=>move(50,700);E.speed.oninput=()=>{uiSpeed();save();if(hamp){clearTimeout(speedTimer);speedTimer=setTimeout(setSpeed,150)}};document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{E.speed.value=b.dataset.s;E.speed.dispatchEvent(new Event('input'))});E.rmin.oninput=()=>{uiRange('min');save()};E.rmax.oninput=()=>{uiRange('max');save()};$('applyRange').onclick=setRange;$('start').onclick=start;$('stop').onclick=stop;$('check').onclick=check;$('patternStop').onclick=stop;document.querySelectorAll('.pattern').forEach(b=>b.onclick=()=>runPattern(b.dataset.p));$('autoStart').onclick=auto;$('autoStop').onclick=stop;$('save').onclick=save;$('clear').onclick=()=>{Object.values(K).forEach(k=>localStorage.removeItem(k));E.appId.value='';E.ck.value='';stat('Nicht geprüft')};window.addEventListener('pagehide',save);if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});load()})();</script></body></html>
